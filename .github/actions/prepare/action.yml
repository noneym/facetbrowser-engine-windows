name: Prepare Build Environment
description: Set up Python, copy workspace, and install stage dependencies
inputs:
  python-version:
    description: Python version
    required: false
    default: '3.12'
  finished:
    description: The build has finished in an earlier stage, so only the stage action is set up
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      if: ${{ inputs.finished != 'true' }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Use another engine revision
      if: ${{ env.ENGINE_REF != '' && inputs.finished != 'true' }}
      shell: pwsh
      run: |
        git -C ungoogled-chromium fetch --depth 1 origin "$env:ENGINE_REF"
        if ($LASTEXITCODE -ne 0) { throw "could not fetch engine revision $env:ENGINE_REF" }
        git -C ungoogled-chromium checkout --detach FETCH_HEAD
        if ($LASTEXITCODE -ne 0) { throw "could not check out engine revision $env:ENGINE_REF" }
        git -C ungoogled-chromium log --oneline -1

    - name: Init
      if: ${{ inputs.finished != 'true' }}
      shell: pwsh
      run: Copy-Item -Path . -Destination 'C:\ungoogled-chromium-windows' -Recurse

    - name: Setup Stage
      shell: pwsh
      run: npm install
      working-directory: ./.github/actions/stage
    - name: Install Windows SDK 10.0.28000.0
      if: ${{ inputs.finished != 'true' }}
      shell: pwsh
      run: |
        if (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.28000.0') {
          Write-Host 'SDK 10.0.28000.0 already installed.'
          exit 0
        }
        $installer = "$env:TEMP\winsdksetup.exe"
        Invoke-WebRequest -Uri 'https://download.microsoft.com/download/38ab8f6d-3676-4860-ae84-3361308b9d7f/KIT_BUNDLE_WINDOWSSDK_MEDIACREATION/winsdksetup.exe' -OutFile $installer
        $features = '/features OptionId.DesktopCPPx64 OptionId.DesktopCPPx86 OptionId.DesktopCPPArm64 OptionId.WindowsDesktopDebuggers OptionId.UWPCPP OptionId.SigningTools /q /norestart /ceip off'
        $proc = Start-Process -FilePath $installer -ArgumentList $features -PassThru -Wait
        if ($proc.ExitCode -ne 0) { throw "winsdksetup.exe failed with code $($proc.ExitCode)" }
        if (-not (Test-Path 'C:\Program Files (x86)\Windows Kits\10\Include\10.0.28000.0')) {
          throw 'SDK 10.0.28000.0 not found after install.'
        }
