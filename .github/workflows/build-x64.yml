name: build-x64
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Continue from the build artifact of this run id instead of starting from scratch
        type: string
        required: false
        default: ''
  push:
    tags:
      - '*'

permissions:
  contents: read
  actions: read

concurrency:
  group: build-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      resume-run-id: ${{ inputs.resume_run_id }}
