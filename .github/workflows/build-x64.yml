name: build-x64
on:
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Continue from the build artifact of this run id instead of starting from scratch
        type: string
        required: false
        default: ''
      engine_ref:
        description: Branch, tag or commit of the engine repository to build instead of the pinned submodule
        type: string
        required: false
        default: ''
      preflight_only:
        description: Stop after compiling the files the engine patches change
        type: boolean
        required: false
        default: false
  push:
    tags:
      - '*'

permissions:
  contents: read
  actions: read

concurrency:
  group: build-x64-${{ github.ref }}-${{ inputs.engine_ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      resume-run-id: ${{ inputs.resume_run_id }}
      engine-ref: ${{ inputs.engine_ref }}
      preflight-only: ${{ inputs.preflight_only || false }}
